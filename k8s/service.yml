apiVersion: v1
kind: Service
metadata:
  name: web-api
  namespace: apps
  labels:
    app.kubernetes.io/name: web-api
    app.kubernetes.io/instance: web-api
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  # Selector must match the Deployment's pod template labels exactly.
  # If these drift you get a Service with zero endpoints and a very confusing
  # 503 from the ingress. `kubectl get endpoints web-api` is the check.
  selector:
    app.kubernetes.io/name: web-api
    app.kubernetes.io/instance: web-api
  ports:
    - name: http
      port: 80
      # targetPort refers to the named container port, not a number. Renaming
      # the port in the Deployment is then a one-line change here too.
      targetPort: http
      protocol: TCP
  sessionAffinity: None
  internalTrafficPolicy: Cluster
