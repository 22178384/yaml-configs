apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-api
  namespace: apps
  labels:
    app.kubernetes.io/name: web-api
    app.kubernetes.io/instance: web-api
    app.kubernetes.io/component: api
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    # /metrics should never be reachable from outside. The Prometheus scrape
    # goes pod-to-pod, so blocking it at the ingress costs nothing.
    nginx.ingress.kubernetes.io/server-snippet: |
      location = /metrics {
        deny all;
        return 403;
      }
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.example.com
      secretName: web-api-tls
  rules:
    - host: api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-api
                port:
                  name: http
