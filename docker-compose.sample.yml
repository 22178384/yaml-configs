services:
  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./webroot:/usr/share/nginx/html:ro
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: example
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
