# GitLab CI for the same project the GitHub Actions templates cover. I keep
# both because some clients only give you GitLab and it's cheaper to maintain
# this than to argue about it.
#
# Runner needs: docker executor, and a DinD service for the image job.

stages:
  - lint
  - test
  - build
  - deploy

default:
  image: python:3.11-slim
  interruptible: true
  cache:
    key:
      files:
        - pyproject.toml
    paths:
      - .cache/pip/

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

lint:ruff:
  stage: lint
  script:
    - pip install ruff==0.4.10
    - ruff check .
    - ruff format --check .

lint:yaml:
  stage: lint
  script:
    - pip install yamllint==1.35.1
    # The k8s manifests in this project are multi-doc, so the default
    # "document-start" rule is disabled in .yamllint. Keep it that way.
    - yamllint -c .yamllint .

test:unit:
  stage: test
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_DB: test
    POSTGRES_USER: test
    POSTGRES_PASSWORD: test
    DATABASE_URL: "postgresql://test:test@postgres:5432/test"
    REDIS_URL: "redis://localhost:6379/0"
  script:
    - pip install -e ".[test]"
    - pytest -q
      --junitxml=report.xml
      --cov=src --cov-report=term --cov-report=xml
  coverage: '/^TOTAL.+?(\d+\%)$/'
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - report.xml

build:wheel:
  stage: build
  needs: ["test:unit"]
  script:
    - pip install build
    - python -m build
    - ls -lh dist/
  artifacts:
    name: "dist-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist/
    expire_in: 1 month

build:docker:
  stage: build
  needs: ["lint:ruff"]
  image: docker:27.0-cli
  services:
    - name: docker:27.0-dind
      alias: docker
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build
        --build-arg PYTHON_VERSION=3.11
        --cache-from "$CI_REGISTRY_IMAGE:latest"
        -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
        docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

deploy:staging:
  stage: deploy
  needs: ["build:docker"]
  image: bitnami/kubectl:1.29
  environment:
    name: staging
    url: https://staging.example.com
    on_stop: stop:staging
  script:
    - kubectl config use-context "$KUBE_CONTEXT_STAGING"
    - kubectl -n apps set image deployment/web-api api="$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - kubectl -n apps rollout status deployment/web-api --timeout=180s
    - kubectl -n apps get pods -l app.kubernetes.io/name=web-api
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

deploy:production:
  stage: deploy
  needs: ["build:docker"]
  image: bitnami/kubectl:1.29
  environment:
    name: production
    url: https://api.example.com
  script:
    - kubectl config use-context "$KUBE_CONTEXT_PROD"
    - kubectl -n apps set image deployment/web-api api="$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
    - kubectl -n apps rollout status deployment/web-api --timeout=300s
  rules:
    # Manual gate. I have never once regretted making prod a button press.
    - if: '$CI_COMMIT_TAG'
      when: manual
      allow_failure: false

stop:staging:
  stage: deploy
  image: bitnami/kubectl:1.29
  when: manual
  environment:
    name: staging
    action: stop
  script:
    - kubectl config use-context "$KUBE_CONTEXT_STAGING"
    - kubectl -n apps scale deployment/web-api --replicas=0
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
